<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff0f6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="누나의 비행기 모드"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png"><title>누나의 비행기 모드 3.0</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#5d465a;background:#fff1f6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 5%,#ffedc9,transparent 35%),radial-gradient(circle at 5% 65%,#e9dfff,transparent 40%),#fff1f6;min-height:100dvh}main{max-width:560px;margin:auto;padding:22px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;color:#a66e94;font-weight:800}.pill{border-radius:22px;background:#fff;padding:9px 13px}.hero{text-align:center;padding:32px 0 12px}.hero .emoji{font-size:76px;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}h1{font-size:32px;margin:12px 0;color:#784c72}h2{color:#784c72}p{line-height:1.7}.sub{color:#977c93}.panel{background:#fffefdf0;border:2px solid white;border-radius:27px;padding:22px 19px;box-shadow:0 12px 28px #dcb8ce55;margin:17px 0}.btn{border:0;border-radius:17px;padding:15px 17px;background:#ee8fb5;color:white;font-size:16px;font-weight:800;width:100%;margin:7px 0;box-shadow:0 5px 0 #d8759d;cursor:pointer}.btn.secondary{background:#efe3fb;color:#785a90;box-shadow:0 4px 0 #d8c7ed}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.small{font-size:13px;padding:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.hidden{display:none!important}.tiny{font-size:12px;color:#a58ba1;text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stage{border:2px solid #fff;background:#fff8fd;border-radius:23px;padding:19px 9px;text-align:center;min-height:155px;box-shadow:0 6px 15px #dec6d355;cursor:pointer}.stage:disabled{filter:grayscale(.7);opacity:.6;cursor:default}.stage .big{font-size:39px}.stage b{display:block;margin:6px 0;color:#72536e}.stage small{color:#9e849a}.progress{height:12px;background:#f3dce7;border-radius:22px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#ff9ebc,#c9a3ef);transition:width .3s}.option{display:block;width:100%;border:2px solid #f0dce9;background:#fff9fc;border-radius:15px;padding:14px;text-align:left;font-size:16px;color:#604b61;margin:9px 0;cursor:pointer}.option.correct{background:#def8e9;border-color:#6fce9e}.option.wrong{background:#ffe1e5;border-color:#e69ca9}.feedback{background:#fff0f7;padding:13px;border-radius:14px;line-height:1.6;margin-top:14px}.tag{background:#f4e5ff;border-radius:30px;padding:7px 12px;font-size:12px;color:#9067ab}.letter{white-space:pre-wrap;line-height:1.95;background:#fffaf1;border:2px dashed #ecc3cb;border-radius:18px;padding:21px;font-size:15px}.polaroid{background:white;padding:15px 15px 40px;box-shadow:0 10px 24px #796e7740;transform:rotate(-2deg);margin:14px auto 26px;max-width:340px}.photo{height:215px;background:linear-gradient(140deg,#ffdeed,#e1d8ff);display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo span{font-size:68px}.photo-caption{text-align:center;color:#93778a;font-family:cursive;margin-top:17px}.envelope{font-size:85px;text-align:center;animation:float 2.5s ease-in-out infinite}.notice{font-size:13px;color:#92748d;background:#fff5ec;border-radius:12px;padding:12px;line-height:1.6}textarea,input{font:inherit;width:100%;border:2px solid #eedbe8;border-radius:12px;padding:12px;margin:6px 0;background:white;color:#604b61}textarea{min-height:85px;resize:vertical}label{font-size:13px;color:#806781;font-weight:700}hr{border:0;border-top:1px solid #f0e0eb;margin:17px 0}.footer{text-align:center;color:#b190a7;font-size:12px;margin-top:25px}</style></head><body><main><div class="top"><span>☁️ 막내의 작은 선물</span><span class="pill" id="status">✈️ 0/6</span></div>
<section id="home"><div class="hero"><div class="emoji">🐰✈️</div><h1>누나의<br>비행기 모드 3.0</h1><p class="sub">여섯 개의 작은 세계를 여행해 봐 💌</p></div><div class="panel"><p style="text-align:center"><b>6개의 스테이지 · 총 80문제</b><br>1~4는 11문제, 5~6은 7문제 이상이면 클리어!<br>각 스테이지 끝에는 편지가 기다려 🌷</p><button class="btn" id="goMap">모험 시작하기 💗</button><button class="btn secondary" id="goLetters">💌 편지 보관함</button></div><p class="tiny">최초 온라인 설치 후 비행기 모드에서도 플레이 가능</p></section>
<section id="map" class="hidden"><div class="panel"><div class="row"><button class="btn secondary small" style="width:auto" data-back="home">← 홈</button><h2>🗺️ 스테이지 선택</h2></div><div id="stageGrid" class="grid"></div><p class="tiny">앞 스테이지를 클리어하면 다음이 열려요.</p><button class="btn secondary" id="mapLetters">💌 편지 보관함</button></div></section>
<section id="quiz" class="hidden"><div class="panel"><div class="row"><button class="btn secondary small" style="width:auto" data-back="map">← 지도</button><span class="tag" id="quizStage"></span><b id="count"></b></div><div class="progress"><div id="bar"></div></div><div id="polaroid" class="polaroid hidden"><div class="photo" id="photo"></div><div class="photo-caption" id="photoCaption"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><button class="btn hidden" id="next">다음 문제 →</button><button class="btn secondary small" id="abandon">이 도전 다시 시작하기 🔄</button></div></section>
<section id="result" class="hidden"><div class="hero"><div class="emoji" id="resultEmoji">🎉</div><h1 id="resultTitle">STAGE CLEAR!</h1><p class="sub" id="resultText"></p></div><div class="panel"><button class="btn" id="resultPrimary"></button><button class="btn secondary" id="resultMap">스테이지 지도로</button></div></section>
<section id="letter" class="hidden"><div class="panel"><div class="envelope">💌</div><h2 id="letterTitle" style="text-align:center"></h2><div class="letter" id="letterText"></div><button class="btn" id="letterNext">스테이지 지도로 →</button></div></section>
<section id="letters" class="hidden"><div class="panel"><div class="row"><button class="btn secondary small" style="width:auto" data-back="map">← 지도</button><h2>💌 편지 보관함</h2></div><div id="letterList"></div></div></section>

<div class="footer">Made with ♡ · 오프라인 퀴즈 여행</div></main><script src="./game-data.js"></script><script>
(()=>{'use strict';const D=window.GAME_DATA,$=id=>document.getElementById(id),key='nunaQuizV3';let state={completed:[],best:{},current:null,},stage=0,letterStage=0;try{const d=JSON.parse(localStorage.getItem(key));if(d&&Array.isArray(d.completed)){state={...state,...d}}}catch(e){};function save(){localStorage.setItem(key,JSON.stringify(state))}function show(id){document.querySelectorAll('main>section').forEach(el=>el.classList.toggle('hidden',el.id!==id));$('status').textContent='✈️ '+state.completed.length+'/6';window.scrollTo(0,0)}function unlocked(i){return i===0||state.completed.includes(i-1)}function questions(i){return D.questions[i]}function complete(i){return questions(i).length===(i<4?15:10)&&questions(i).every(q=>q.text&&q.options&&q.options.length>=2&&q.options.every(Boolean)&&q.options.includes(q.answer))}function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function map(){let box=$('stageGrid');box.replaceChildren();D.stages.forEach((s,i)=>{let b=document.createElement('button');b.className='stage';b.disabled=!unlocked(i);b.innerHTML='<div class="big">'+(!unlocked(i)?'🔒':s.emoji)+'</div><small>STAGE '+(i+1)+'</small><b>'+s.name+'</b><small>'+(state.completed.includes(i)?'✓ 클리어':!unlocked(i)?'잠금':s.subtitle)+'</small>';b.onclick=()=>selectStage(i);box.append(b)});show('map')}function selectStage(i){stage=i;if(!complete(i)){alert('문제 데이터가 준비되지 않았어요.');return}if(state.current&&state.current.stage===i){if(confirm('진행 중인 기록이 있어요. 이어서 풀까요?\n취소를 누르면 새 도전이 시작돼요.')){render();return}}start(i)}function start(i){let qs=questions(i);state.current={stage:i,order:shuffle(qs.map(q=>q.id)),index:0,score:0,choiceOrder:{},answered:null};qs.forEach(q=>{state.current.choiceOrder[q.id]=shuffle(q.options)});save();render()}function getQ(){let r=state.current;return questions(r.stage).find(q=>q.id===r.order[r.index])}function render(){let r=state.current;if(!r){map();return}stage=r.stage;if(r.index>=questions(r.stage).length){finish();return}let q=getQ();show('quiz');$('quizStage').textContent=D.stages[stage].emoji+' '+D.stages[stage].name;$('count').textContent=(r.index+1)+' / '+questions(stage).length;$('bar').style.width=(r.index/questions(stage).length*100)+'%';$('question').textContent=q.text;let pol=$('polaroid');pol.classList.toggle('hidden',stage!==5);if(stage===5){$('photo').replaceChildren();if(q.image){let img=document.createElement('img');img.src=q.image;img.alt='추억 사진';img.onerror=()=>{img.replaceWith(document.createTextNode('📸'))};$('photo').append(img)}else{let s=document.createElement('span');s.textContent='📸';$('photo').append(s)}$('photoCaption').textContent='우리의 추억 · '+(r.index+1)+'번째 사진'}let opts=$('options');opts.replaceChildren();r.choiceOrder[q.id].forEach((opt,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>choose(opt);if(r.answered){b.disabled=true;if(opt===q.answer)b.classList.add('correct');else if(opt===r.answered.choice)b.classList.add('wrong')}opts.append(b)});$('feedback').classList.toggle('hidden',!r.answered);$('next').classList.toggle('hidden',!r.answered);if(r.answered)$('feedback').textContent=(r.answered.correct?'정답! 🎉 ':'괜찮아! 🌷 ')+(q.explain||'');}function choose(opt){let r=state.current;if(r.answered)return;let q=getQ(),correct=opt===q.answer;r.answered={choice:opt,correct};if(correct)r.score++;save();render()}function finish(){let r=state.current;if(!r)return;stage=r.stage;let total=questions(stage).length,pass=stage<4?11:7,won=r.score>=pass;if(won){if(!state.completed.includes(stage))state.completed.push(stage);state.best[stage]=Math.max(state.best[stage]||0,r.score)}state.current=null;save();show('result');$('resultEmoji').textContent=won?'🎉':'🌷';$('resultTitle').textContent=won?'STAGE CLEAR!':'조금만 더 힘내!';$('resultText').textContent=total+'문제 중 '+r.score+'문제 정답 · '+(won?'편지가 도착했어요! 💌':pass+'문제 이상이면 클리어야!');$('resultPrimary').textContent=won?'💌 편지 열어보기':'🔄 문제 순서 섞어서 재도전';$('resultPrimary').onclick=()=>won?openLetter(stage):start(stage)}function openLetter(i){letterStage=i;$('letterTitle').textContent='STAGE '+(i+1)+' · '+D.stages[i].name;$('letterText').textContent=D.letters[i];$('letterNext').textContent=i===5?'🎁 엔딩 마치기':'다음 스테이지로 →';show('letter')}function letterList(){let box=$('letterList');box.replaceChildren();D.stages.forEach((s,i)=>{let b=document.createElement('button');b.className='btn secondary';b.textContent=state.completed.includes(i)?'💌 '+s.name+' · 편지 읽기':'🔒 '+s.name+' · 아직 잠김';b.disabled=!state.completed.includes(i);b.onclick=()=>openLetter(i);box.append(b)});show('letters')}$('goMap').onclick=map;$('goLetters').onclick=letterList;$('mapLetters').onclick=letterList;$('next').onclick=()=>{let r=state.current;if(!r||!r.answered)return;r.index++;r.answered=null;save();render()};$('abandon').onclick=()=>{if(confirm('현재 스테이지를 처음부터 다시 풀까요? 진행 중인 점수는 초기화돼요.'))start(stage)};$('resultMap').onclick=map;$('letterNext').onclick=map;document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>b.dataset.back==='home'?show('home'):map());show('home');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(reg=>{if(navigator.onLine)reg.active?.postMessage('CACHE_PHOTOS')}).catch(()=>{}));})();
</script></body></html>
